# Gamebook Authoring Tool — Configuration
#
# Copy this file to config.yaml and edit. Environment variables
# override config.yaml values where specified.
#
# Database: SQLite for dev, PostgreSQL for production.
# Inference: external endpoint (LoadCoach or OpenAI-compatible).
#
# Override with env vars:
#   DATABASE_URL
#   INFERENCE_ENDPOINT
#   INFERENCE_API_KEY
#   INFERENCE_DEFAULT_MODEL
#   FRONTEND_URL

# ── Database ──────────────────────────────────────────────
# SQLite (development) or PostgreSQL (production).
# PostgreSQL example: postgresql://user:pass@host:5432/gamebook
database_url: "sqlite:///gamebook.db"

# ── Inference ─────────────────────────────────────────────
# External AI model endpoint. The app sends prompts here and
# stores the responses. No model is served by this app.
inference:
  endpoint: "http://localhost:8442/v1/chat/completions"
  api_key: "${INFERENCE_API_KEY}"           # override with env var
  default_model: "qwen3-35b"
  timeout: 120                              # seconds
  max_retries: 3

# ── Frontend ──────────────────────────────────────────────
# CORS origin for the frontend during development.
frontend_url: "http://localhost:8000"

# ── Output ────────────────────────────────────────────────
# Directory for assembled PDF/EPUB/HTML files.
output_dir: "output"
