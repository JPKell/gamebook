      after: []
    skills: []
    classes: []
    slots: []
    combat:
      player_attack: 2d6 + player.SKILL
      enemy_attack: 2d6 + enemy.SKILL
      damage: '2'
      damage_stat: STAMINA
      damage_hooks: []
      multi_enemy: sequential
      flee_allowed: true
      flee_cost:
      - once: null
        min_tier: null
        print_text: null
        op: modify
        stat: STAMINA
        amount: '-2'
    progression:
      xp_stat: null
      level_stat: null
      xp_award: null
      xp_to_next: null
      max_level: null
      level_up: null
    class_choice: null
    starting_items: []
    rules_text: |-
      Roll one die and add 6 for your SKILL, two dice and add 12 for your STAMINA, and one die plus 6 for your LUCK. You start with 10 Gold.

      **Fighting.** Each round, roll two dice and add your SKILL; then roll two dice and add your opponent's SKILL. Whoever scores higher wounds the other for 2 STAMINA. A tie means you both miss. Anyone reduced to 0 STAMINA is defeated.

      **Testing your Luck.** Roll two dice. If the total is equal to or less than your LUCK you are lucky. Either way, subtract 1 from your LUCK.
  - key: medium
    label: Medium
    parent: basic
    description: Adds armour, equipment slots, experience and levels.
    stats:
    - key: ARMOR
      label: Armour
      description: ''
      kind: stat
      applies_to:
      - player
      - enemy
      initial: '0'
      min: 0
      max: null
      max_is_initial: false
      defeat_at: null
    - key: XP
      label: Experience
      description: ''
      kind: stat
      applies_to:
      - player
      initial: '0'
      min: 0
      max: null
      max_is_initial: false
      defeat_at: null
    - key: LEVEL
      label: Level
      description: ''
      kind: stat
      applies_to:
      - player
      initial: '1'
      min: 1
      max: null
      max_is_initial: false
      defeat_at: null
    tests: []
    skills: []
    classes: []
    slots:
    - weapon
    - body
    - shield
    combat:
      player_attack: null
      enemy_attack: null
      damage: null
      damage_stat: null
      damage_hooks:
      - max(1, damage - target.ARMOR)
      multi_enemy: null
      flee_allowed: null
      flee_cost: null
    progression:
      xp_stat: XP
      level_stat: LEVEL
      xp_award: max(1, 10 + 5 * (enemy_level - level))
      xp_to_next: 100 * level
      max_level: 10
      level_up:
      - stat: STAMINA
        amount: '2'
      - stat: SKILL
        amount: 'level % 3 == 0 ? 1 : 0'
    class_choice: null
    starting_items: []
    rules_text: |-
      **Armour.** Every wound is reduced by the target's ARMOUR, but always does at least 1 damage. You may wear one weapon, one suit of body armour and one shield; their bonuses count only while equipped.

      **Experience.** You begin at LEVEL 1 with 0 XP. Each enemy you defeat in a fight you win earns 10 XP, plus 5 for every level it is above yours (or minus 5 for every level below; always at least 1). When your XP reaches 100 times your LEVEL, subtract that much XP and go up a level: add 2 to your STAMINA and its starting value, and at every third level add 1 to your SKILL and its starting value. The highest level is 10.
