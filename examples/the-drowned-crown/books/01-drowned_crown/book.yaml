title: The Drowned Crown
synopsis: The reeve of Marrowmere hires you to cross the Greywood and the drowned fen, descend into the
  Sunken Abbey and reach the Hollow Keep, where a dead king still wears the crown that drowned his kingdom.
  Recover its three shards, or end it for good.
