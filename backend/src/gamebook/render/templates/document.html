<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 11pt/1.45 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
  .appendix { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { font-size: 1.6rem; margin: 0 0 1rem; letter-spacing: .02em; text-align: center; }
  h2 { font-size: 1.15rem; margin: 1.4rem 0 .4rem; }
  h3, h4 { font-size: 1rem; margin: 1rem 0 .3rem; }
  p { margin: .35rem 0; }
  {% include "appendix.css" %}
</style>
</head>
<body>
{{ body }}
</body>
</html>
