[project]
name = "gamebook"
version = "0.1.0"
description = "Gamebook Studio — authoring, simulation and publishing tool for gamebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "httpx2>=2.13.1",
]

[project.scripts]
gamebook = "gamebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamebook"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4", "PIE", "RET"]
ignore = [
    "B008",  # FastAPI Depends() in defaults
    "E501",  # line length is the formatter's job; long strings are fine
]

[tool.ruff.lint.per-file-ignores]
"src/gamebook/core/gbx/ast.py" = ["RUF009"]  # span fields share a field() factory

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "gamebook.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
